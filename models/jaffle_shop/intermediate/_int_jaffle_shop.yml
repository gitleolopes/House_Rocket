models:
  - name: int_orders
    description: Order-level enriched data.
    columns:
      - name: order_id
        description: Primary key for the orders table
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order
      - name: order_date
        description: Date when the order was created
      - name: order_status
        description: "{{ doc('order_status') }}"
      - name: is_paid
        description: Boolean flag indicating whether the order has at least one successful payment
      - name: paid_amount
        description: Total monetary amount successfully paid for the order

  - name: int_customers
    description: Customer-level aggregated metrics
    columns:
      - name: customer_id
        description: Primary key for the customers table
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer first name
      - name: last_name
        description: Customer last name
      - name: full_name
        description: Customer full name (first name + last name)
      - name: total_orders
        description: Total number of orders placed by the customer
      - name: first_order_date
        description: Date of the customer’s first order. Null if no orders exist.
      - name: last_order_date
        description: Date of the customer’s most recent order. Null if no orders exist.
      - name: has_orders
        description: Boolean flag indicating whether the customer has placed at least one order
      - name: total_revenue
        description: Total revenue generated by the customer from successfully paid orders
      - name: avg_order_value
        description: Average paid amount per paid order for the customer