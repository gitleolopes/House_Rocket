macros:
  - name: cents_to_dollars
    description: Converts an amount from cents to dollars and rounds it to the specified number of decimal places. Defaults to 2 decimal places.
    arguments:
      - name: column_name
        type: string
        description: The name of the column containing the amount in cents.
      - name: decimal
        type: integer
        description: The number of decimal places to round to. Defaults to 2.

  - name: anonymize
    description: Anonymizes a field using SHA-256 hashing.
    arguments:
      - name: column_name
        type: string
        description: The name of the column containing the value to anonymize.